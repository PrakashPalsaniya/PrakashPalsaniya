name: Update GitHub activity

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh activity cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/generate_activity.py

      - name: Publish updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity*.svg .github/activity-data.json
          if ! git diff --staged --quiet; then
            git commit -m "Update GitHub activity"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
