2" font-family="Consolas,'Liberation Mono',monospace" font-size="12" fill="#20251b" font-weight="400" >Docker</text><path d="M650 83L650 346" fill="none" stroke="#d2d8c6" stroke-width="1" /><g transform="translate(685 83) scale(1)" ><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d2d8c6" /></pattern></defs><rect x="0" y="0" width="470" height="286" rx="0" fill="url(#grid)" /><text x="20" y="28" font-family="Consolas,'Liberation Mono',monospace" font-size="10" fill="#59634d" font-weight="600" letter-spacing="1" >04 / TWO PATHS. ONE CLICK.</text><rect x="21" y="66" width="132" height="58" rx="9" fill="#f7f7f0" stroke="#d2d8c6" /><text x="87" y="101" font-family="Consolas,'Liberation Mono',monospace" font-size="15" fill="#20251b" font-weight="700" text-anchor="middle">/your-link</text><path d="M153 95H201" fill="none" stroke="#d2d8c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M153 95H201" fill="none" stroke="#116c7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="packet" style="animation-delay:-1s"/><rect x="201" y="66" width="105" height="58" rx="9" fill="#e3e7d9" stroke="#116c7d" /><text x="253" y="92" font-family="Consolas,'Liberation Mono',monospace" font-size="13" fill="#116c7d" font-weight="700" text-anchor="middle">REDIS</text><text x="253" y="110" font-family="Consolas,'Liberation Mono',monospace" font-size="10" fill="#59634d" font-weight="400" text-anchor="middle">cached URL</text><path d="M306 95H350" fill="none" stroke="#d2d8c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M306 95H350" fill="none" stroke="#116c7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="packet" style="animation-delay:-3s"/><rect x="350" y="66" width="99" height="58" rx="9" fill="#f7f7f0" stroke="#d2d8c6" /><text x="399" y="101" font-family="Consolas,'Liberation Mono',monospace" font-size="20" fill="#20251b" font-weight="700" text-anchor="middle">302 ↗</text><path d="M176 95V192H214" fill="none" stroke="#d2d8c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M176 95V192H214" fill="none" stroke="#116c7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="packet" style="animation-delay:-4s"/><rect x="214" y="165" width="235" height="55" rx="9" fill="#f7f7f0" stroke="#d2d8c6" /><rect x="230" y="185" width="8" height="14" rx="2" fill="#116c7d" opacity="1.0"/><rect x="243" y="185" width="8" height="14" rx="2" fill="#116c7d" opacity="0.75"/><rect x="256" y="185" width="8" height="14" rx="2" fill="#116c7d" opacity="0.5"/><text x="283" y="188" font-family="Consolas,'Liberation Mono',monospace" font-size="11" fill="#116c7d" font-weight="700" >CLICK EVENT</text><text x="283" y="206" font-family="Consolas,'Liberation Mono',monospace" font-size="11" fill="#59634d" font-weight="400" >→ analytics worker</text><text x="22" y="264" font-family="Consolas,'Liberation Mono',monospace" font-size="11" fill="#116c7d" font-weight="600" letter-spacing="1" >REDIRECT NOW. ANALYZE ASYNC.</text></g></svg>
