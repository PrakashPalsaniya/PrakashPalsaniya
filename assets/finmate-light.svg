<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title description"><title id="title">FinMate</title><desc id="description">FinMate: Less logging. More living. Track spending, one conversation at a time. Chat or Telegram → expense entry → reports → assistant + Excel export. Stack: Gemini, Telegram, Redis, Excel.</desc>
<style>
  .packet { stroke-dasharray: 9 180; animation: travel 8s linear infinite; }
  .breathe { animation: breathe 5s ease-in-out infinite; }
  .float { animation: float 7s ease-in-out infinite; }
  .scan { animation: scan 6s ease-in-out infinite; }
  @keyframes travel { to { stroke-dashoffset: -378; } }
  @keyframes breathe { 0%,100% { opacity:.45; } 50% { opacity:1; } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
  @keyframes scan { 0%,100% { transform:translateY(0); opacity:.35; } 50% { transform:translateY(62px); opacity:.85; } }
  @media (prefers-reduced-motion: reduce) {
    .packet,.breathe,.float,.scan { animation:none; }
  }
</style>
