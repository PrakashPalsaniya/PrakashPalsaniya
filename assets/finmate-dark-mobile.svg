<svg xmlns="http://www.w3.org/2000/svg" width="640" height="742" viewBox="0 0 640 742" role="img" aria-labelledby="title description"><title id="title">FinMate</title><desc id="description">FinMate: Less logging. More living. Track spending, one conversation at a time. Chat or Telegram → expense entry → reports → assistant + Excel export. Stack: Gemini, Telegram, Redis, Excel.</desc>
<style>
  .packet { stroke-dasharray: 9 180; animation: travel 8s linear infinite; }
  .breathe { animation: breathe 5s ease-in-out infinite; }
  .float { animation: float 7s ease-in-out infinite; }
  .scan { animation: scan 6s ease-in-out infinite; }
  @keyframes travel { to { stroke-dashoffset: -378; } }
  @keyframes breathe { 0%,100% { opacity:.45; } 50% { opacity:1; } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
  @keyframes scan { 0%,100% { transform:translateY(0); opacity:.35; } 50% { transform:translateY(62px); opacity:.85; } }
  @media (prefers-reduced-motion: reduce) {
    .packet,.breathe,.float,.scan { animation:none; }
  }
</style>
<rect x="1" y="1" width="638" height="740" rx="16" fill="#111310" stroke="#343b2d" /><rect x="32" y="32" width="37" height="27" rx="4" fill="#bfa5ff" /><text x="50.5" y="51" font-family="Consolas,'Liberation Mono',monospace" font-size="12" fill="#111310" font-weight="700" text-anchor="middle">03</text><text x="82" y="51" font-family="Consolas,'Liberation Mono',monospace" font-size="16" fill="#bfa5ff" font-weight="600" letter-spacing="1" >PERSONAL FINANCE + AI</text><path d="M585 53L603 35M585 35H603V53" fill="none" stroke="#bfa5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="104" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#f1f2e9" font-weight="700" >FinMate</text><text x="30" y="171" font-family="Arial,Helvetica,sans-serif" font-size="59" fill="#f1f2e9" font-weight="700" letter-spacing="-2.5">Less logging.</text><text x="30" y="230" font-family="Arial,Helvetica,sans-serif" font-size="59" fill="#bfa5ff" font-weight="700" letter-spacing="-2.5">More living.</text><text x="32" y="272" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#a5ad9b" font-weight="400" >Track spending, one conversation at a time.</text><rect x="32" y="303" width="95.12" height="36" rx="5" fill="#191c17" stroke="#343b2d" /><text x="45" y="329" font-family="Consolas,'Liberation Mono',monospace" font-size="18" fill="#f1f2e9" font-weight="400" >Gemini</text><rect x="135.12" y="303" width="118.16" height="36" rx="5" fill="#191c17" stroke="#343b2d" /><text x="148.12" y="329" font-family="Consolas,'Liberation Mono',monospace" font-size="18" fill="#f1f2e9" font-weight="400" >Telegram</text><rect x="261.28" y="303" width="83.6" height="36" rx="5" fill="#191c17" stroke="#343b2d" /><text x="274.28" y="329" font-family="Consolas,'Liberation Mono',monospace" font-size="18" fill="#f1f2e9" font-weight="400" >Redis</text><rect x="352.88" y="303" width="83.6" height="36" rx="5" fill="#191c17" stroke="#343b2d" /><text x="365.88" y="329" font-family="Consolas,'Liberation Mono',monospace" font-size="18" fill="#f1f2e9" font-weight="400" >Excel</text><path d="M32 360H608" stroke="#343b2d" stroke-width="1" /><g transform="translate(38 384) scale(1.2)" ><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#343b2d" /></pattern></defs><rect x="0" y="0" width="470" height="286" rx="0" fill="url(#grid)" /><text x="20" y="28" font-family="Consolas,'Liberation Mono',monospace" font-size="12.0" fill="#a5ad9b" font-weight="600" letter-spacing="1" >03 / SPENDING, IN CONVERSATION</text><rect x="27" y="60" width="279" height="47" rx="12" fill="#111310" stroke="#343b2d" /><text x="44" y="89" font-family="Arial,Helvetica,sans-serif" font-size="20.4" fill="#f1f2e9" font-weight="400" >Add lunch, ₹180</text><circle cx="287" cy="84" r="7" fill="#bfa5ff" /><path d="M284 84L287 87L291 81" fill="none" stroke="#111310" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><rect x="91" y="121" width="353" height="96" rx="12" fill="#111310" stroke="#343b2d" /><text x="110" y="147" font-family="Arial,Helvetica,sans-serif" font-size="18.0" fill="#bfa5ff" font-weight="600" >Logged. Lunch → Food</text><text x="110" y="174" font-family="Arial,Helvetica,sans-serif" font-size="15.6" fill="#a5ad9b" font-weight="400" >Your spending, a little clearer.</text><rect x="299" y="193" width="10" height="10" rx="2" fill="#bfa5ff" opacity="0.4"/><rect x="316" y="186" width="10" height="17" rx="2" fill="#bfa5ff" opacity="0.49"/><rect x="333" y="191" width="10" height="12" rx="2" fill="#bfa5ff" opacity="0.5800000000000001"/><rect x="350" y="180" width="10" height="23" rx="2" fill="#bfa5ff" opacity="0.67"/><rect x="367" y="186" width="10" height="17" rx="2" fill="#bfa5ff" opacity="0.76"/><rect x="384" y="175" width="10" height="28" rx="2" fill="#bfa5ff" opacity="0.85"/><rect x="401" y="183" width="10" height="20" rx="2" fill="#bfa5ff" opacity="0.9400000000000001"/><text x="110" y="201" font-family="Consolas,'Liberation Mono',monospace" font-size="10.8" fill="#a5ad9b" font-weight="600" letter-spacing="1" >ILLUSTRATIVE CHAT</text><text x="22" y="264" font-family="Consolas,'Liberation Mono',monospace" font-size="13.2" fill="#bfa5ff" font-weight="600" letter-spacing="1" >CHAT → TRACK → UNDERSTAND</text></g></svg>
