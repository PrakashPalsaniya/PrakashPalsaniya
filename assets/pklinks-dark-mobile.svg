.4" y="329" font-family="Consolas,'Liberation Mono',monospace" font-size="18" fill="#f1f2e9" font-weight="400" >Docker</text><path d="M32 360H608" stroke="#343b2d" stroke-width="1" /><g transform="translate(38 384) scale(1.2)" ><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#343b2d" /></pattern></defs><rect x="0" y="0" width="470" height="286" rx="0" fill="url(#grid)" /><text x="20" y="28" font-family="Consolas,'Liberation Mono',monospace" font-size="12.0" fill="#a5ad9b" font-weight="600" letter-spacing="1" >04 / TWO PATHS. ONE CLICK.</text><rect x="21" y="66" width="132" height="58" rx="9" fill="#111310" stroke="#343b2d" /><text x="87" y="101" font-family="Consolas,'Liberation Mono',monospace" font-size="18.0" fill="#f1f2e9" font-weight="700" text-anchor="middle">/your-link</text><path d="M153 95H201" fill="none" stroke="#343b2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M153 95H201" fill="none" stroke="#76d9e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="packet" style="animation-delay:-1s"/><rect x="201" y="66" width="105" height="58" rx="9" fill="#22271e" stroke="#76d9e7" /><text x="253" y="92" font-family="Consolas,'Liberation Mono',monospace" font-size="15.6" fill="#76d9e7" font-weight="700" text-anchor="middle">REDIS</text><text x="253" y="110" font-family="Consolas,'Liberation Mono',monospace" font-size="12.0" fill="#a5ad9b" font-weight="400" text-anchor="middle">cached URL</text><path d="M306 95H350" fill="none" stroke="#343b2d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M306 95H350" fill="none" stroke="#76d9e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="packet" style="animation-delay:-3s"/><rect x="350" y="66" width="99" height="58" rx="9" fill="#111310" stroke="#343b2d" /><text x="399" y="101" font-family="Consolas,'Liberation Mono',monospace" font-size="24.0" fill="#f1f2e9"